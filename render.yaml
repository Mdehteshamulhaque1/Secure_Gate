# Render Infrastructure as Code
# Deploy with: connect this repo → Root Directory: backend
# The database is Supabase PostgreSQL (Session Pooler) — NOT Render Postgres.
# DATABASE_URL is a secret you set in the Render dashboard (never in Git).

services:
  # Django Web Service (API + server-rendered app)
  - type: web
    name: securegate-api
    runtime: python3
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    # Run Django migrations against Supabase before each deploy.
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DJANGO_ENV
        value: "production"
      - key: DJANGO_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Supabase connection string (Session Pooler, port 5432).
      # Set this in Render Dashboard → Environment. Never commit it.
      - key: DATABASE_URL
        sync: false
    healthCheckPath: /api/health/
    autoDeploy: true
