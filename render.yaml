# Render Infrastructure as Code
# Deploy with: render deploy (after installing render CLI) or connect repo in dashboard

services:
  # PostgreSQL Database
  - type: pserv
    name: securegate-db
    plan: free
    region: oregon
    postgresMajorVersion: 16
    databaseName: securegate
    user: securegate

  # Django Web Service
  - type: web
    name: securegate-api
    runtime: python3
    plan: free
    region: oregon
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - fromDatabase:
          name: securegate-db
          property: connectionString
        key: DATABASE_URL
    healthCheckPath: /api/auth/me/
    autoDeploy: true

# Optional: Add a cron job for cleanup (expired QR passes)
# cronJobs:
