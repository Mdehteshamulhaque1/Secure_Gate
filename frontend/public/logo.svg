<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="sgGradientBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer shield background -->
  <path d="M60 6 L112 24 L112 72 C112 92 90 110 60 114 C30 110 8 92 8 72 L8 24 L60 6 Z" 
        fill="url(#sgGradient)" 
        filter="url(#glow)"/>
  
  <!-- Inner shield highlight -->
  <path d="M60 14 L98 28 L98 60 C98 72 78 84 60 86 C42 84 22 72 22 60 L22 28 L60 14 Z" 
        fill="url(#sgGradientBlue)" 
        opacity="0.3"/>
  
  <!-- Gate icon -->
  <g transform="translate(60, 58)">
    <!-- Gate posts -->
    <rect x="-24" y="-18" width="6" height="36" rx="2" fill="white" opacity="0.95"/>
    <rect x="18" y="-18" width="6" height="36" rx="2" fill="white" opacity="0.95"/>
    
    <!-- Top bar -->
    <rect x="-27" y="-22" width="54" height="4" rx="2" fill="white" opacity="0.9"/>
    
    <!-- Gate doors (slightly open) -->
    <rect x="-20" y="-16" width="16" height="32" rx="1" fill="url(#sgGradient)" opacity="0.9"/>
    <rect x="4" y="-16" width="16" height="32" rx="1" fill="url(#sgGradient)" opacity="0.9"/>
    
    <!-- Lock symbol -->
    <g transform="translate(0, 8)">
      <rect x="-6" y="-4" width="12" height="10" rx="2" fill="white" opacity="0.3"/>
      <path d="M-4 0 V-6 A4 4 0 0 1 4 -6 V0" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="0" cy="2" r="1.5" fill="white"/>
    </g>
  </g>
  
  <!-- Subtle particles -->
  <g opacity="0.15">
    <circle cx="25" cy="25" r="2" fill="white"><animate attributeName="cy" values="25;15;25" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="35" r="1.5" fill="white"><animate attributeName="cy" values="35;25;35" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="95" r="1" fill="white"><animate attributeName="cx" values="30;40;30" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="90" r="1.5" fill="white"><animate attributeName="cy" values="90;80;90" dur="4s" repeatCount="indefinite"/></circle>
  </g>
</svg>